<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <header class="page-header">
        <p class="app-label"><i class="fa-solid fa-wallet"></i> STUDENT MONEY TRACKER</p>
        <h1>Manage your money</h1>
        <p class="subtitle">Keep track of what you earn and spend.</p>
    </header>

    <main>
        <section class="balance-card">
            <p>Available Balance</p>
            <h2 id="balance">₦0.00</h2>
            <div class="summary">
                <div><span>Total income</span><strong id="totalIncome">₦0.00</strong></div>
                <div><span>Total expenses</span><strong id="totalExpenses">₦0.00</strong></div>
            </div>
        </section>

        <section class="forms">
            <form id="incomeForm" class="panel">
                <h2><i class="fa-solid fa-circle-plus income-icon"></i> Add Income</h2>
                <label for="incomeAmount">Amount (₦)</label>
                <input id="incomeAmount" type="number" min="0.01" step="0.01" placeholder="e.g. 10000" required>
                <label for="incomeDescription">Description</label>
                <input id="incomeDescription" type="text" placeholder="e.g. Allowance" required>
                <button class="income-button" type="submit">Add Income</button>
            </form>

            <form id="expenseForm" class="panel">
                <h2><i class="fa-solid fa-circle-minus expense-icon"></i> Add Expense</h2>
                <label for="expenseAmount">Amount (₦)</label>
                <input id="expenseAmount" type="number" min="0.01" step="0.01" placeholder="e.g. 1500" required>
                <label for="expenseCategory">Category</label>
                <select id="expenseCategory">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Data & Airtime">Data & Airtime</option>
                    <option value="School">School</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>
                <label for="expenseDescription">Description</label>
                <input id="expenseDescription" type="text" placeholder="e.g. Lunch" required>
                <button class="expense-button" type="submit">Add Expense</button>
            </form>
        </section>

        <section class="panel history-panel">
            <div class="history-heading">
                <div>
                    <h2>Transaction History</h2>
                    <p class="subtitle">Your recent income and expenses.</p>
                </div>
                <button id="clearButton" class="clear-button" type="button">Clear all</button>
            </div>
            <div class="history-tools">
                <input id="searchInput" type="search" placeholder="Search transactions...">
                <select id="filterType" aria-label="Filter transactions">
                    <option value="all">All</option>
                    <option value="income">Income</option>
                    <option value="expense">Expenses</option>
                </select>
            </div>
            <div id="transactionList" class="transaction-list">
                <p class="empty-message">No transactions yet. Add your first income or expense above.</p>
            </div>
        </section>
    </main>

    <p id="message" class="message" role="status"></p>
    <script src="index.js"></script>
</body>
</html>
